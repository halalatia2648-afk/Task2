<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتحليل نتائج الطلاب - هاله عطيه</title>
</head>
<body>
    <h1>افتح الـ Console من F12 عشان تشوف التقرير</h1>
    <script>
        // 1. هيكلة بيانات الطالب (Class & Constructor)
        class Student {
            constructor(id, name, grades, attendance) {
                this.id = id;
                this.name = name;
                this.grades = grades;
                this.attendance = attendance;
            }

            // دالة حساب المتوسط باستخدام reduce
            getAverage() {
                const sum = this.grades.reduce((acc, grade) => acc + grade, 0);
                return sum / this.grades.length;
            }

            // دالة التقدير
            getGrade(average) {
                if (average >= 90) return "A";
                else if (average >= 80) return "B";
                else if (average >= 70) return "C";
                else if (average >= 60) return "D";
                else if (average >= 50) return "E";
                else return "F";
            }

            // دالة النتيجة النهائية
            getFinalResult() {
                const avg = this.getAverage();
                if (avg >= 50 && this.attendance >= 75) {
                    return "ناجح";
                } else {
                    return "يحتاج مراجعة";
                }
            }
        }

        // 2. نظام تشغيل الجامعة (Objects Array)
        const studentsList = [
            new Student(101, "محمد توفيق قابيل", [85, 90, 88], 92),
            new Student(102, "احمد السيد", [45, 42, 48], 80),
            new Student(103, "سارة علي", [95, 92, 98], 96),
            new Student(104, "محمود خالد", [40, 44, 41], 70)
        ];

        // 3. لجنة الرأفة (Array Methods)
        const strugglingStudents = studentsList.filter(student => {
            const avg = student.getAverage();
            return avg >= 40 && avg <= 49;
        });

        // 4. إضافة 5 درجات رأفة باستخدام map
        const afterRafah = strugglingStudents.map(student => {
            const oldAvg = student.getAverage();
            return {
                id: student.id,
                name: student.name,
                oldAverage: oldAvg,
                newAverage: oldAvg + 5
            };
        });

        // 5. حساب متوسط درجات الرأفة باستخدام reduce
        const totalNewAverage = afterRafah.reduce(
            (acc, student) => acc + student.newAverage, 0
        );

        const averageAfterRafah = afterRafah.length > 0
            ? totalNewAverage / afterRafah.length
            : 0;

        // 6. عرض التقرير في Console
        console.log("===== تقرير الطلاب الرئيسي =====");

        studentsList.forEach(student => {
            const avg = student.getAverage();

            console.log(
                `الاسم: ${student.name} | ID: ${student.id} | المتوسط: ${avg.toFixed(2)} | التقدير: ${student.getGrade(avg)} | النتيجة: ${student.getFinalResult()} | الحضور: ${student.attendance}%`
            );
        });

        console.log("\n===== الطلاب المتعثرين (لجنة الرأفة 40-49) =====");

        console.log(
            strugglingStudents.map(s =>
                `${s.name} - متوسطه: ${s.getAverage().toFixed(2)}`
            )
        );

        console.log("\n===== بعد إضافة 5 درجات رأفة =====");
        console.table(afterRafah);

        console.log(
            `\nمتوسط درجات المتعثرين بعد الرأفة: ${averageAfterRafah.toFixed(2)}`
        );

        console.log(
            `\nملاحظة: ${afterRafah.length > 0 ? 'يوجد طلاب متعثرين' : 'لا يوجد طلاب متعثرين - المتوسط = 0'}`
        );
    </script>
</body>
</html>
